<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div id="wrapper">
        <!-- <section> -->
        <div class="container">
        <div class="imagecontainer">
            
                <img src="mug.jpg" alt="Product Image"  >
        </div>
            <div class="details">
                <div class="product">COFFEE MUG</div>
                <h2 class="productTitle">White coffee Mug</h2>
                <p class="desc">Coffee mug are designed to express emotions.These are acclamied for their amazing designs & superior quality</p>
                <br>
                 <span>
                    <span class="sellPrice">₹149</span>
                    <span class="originalPrice"> <del>₹230</del></span>
                 </span>
                <br>
                <br>
                
                <button class="btn">
                    <span class="btnText">ADD TO CART</span>
                </button>
            </div>
            </div>
        <!-- </section> -->
    </div>
</body>
</html>
